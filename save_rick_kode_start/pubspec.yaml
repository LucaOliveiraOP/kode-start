name: save_rick_kode_start
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  audioplayers: ^6.5.0
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.0
  go_router: ^16.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/picke_rick.png
    - assets/images/logo.svg
    - assets/images/rick_and_morty_logo.svg
    - assets/images/portal-rick-and-morty.gif
    - assets/audio/

  fonts:
    - family: GetSchwifty
      fonts:
        - asset: assets/fonts/get_schwifty.ttf
